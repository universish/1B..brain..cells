name: GitHub Releases Harvester Worker

on:
  push:
    branches: [ "main" ]
  schedule:
    - cron: '0 */2 * * *' # Her 2 saatte bir
  workflow_dispatch:

permissions:
  contents: write

jobs:
  harvest-github:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Harvester Code
        uses: actions/checkout@v4

      - name: Install Toolchain and SQLite
        run: |
          sudo apt-get update
          sudo apt-get install -y sqlite3 zstd curl jq

      - name: Execute GitHub Harvester Engine
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p output
          chmod +x scripts/harvest-github.sh
          ./scripts/harvest-github.sh output/github_shard.db

      - name: Publish Shard Artifact to Latest Release
        uses: softprops/action-gh-release@v2
        if: success()
        with:
          tag_name: latest
          name: "GitHub Releases Shard (Automated)"
          files: output/github_shard.db
          draft: false
          prerelease: false
